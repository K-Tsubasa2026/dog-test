spring.application.name=backend

# プロジェクトルートの .env を読み込む（DBの接続情報はここに書かない）
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# data.sqlはHibernateによるテーブル生成(ddl-auto)より後に実行する
spring.jpa.defer-datasource-initialization=true
# PostgreSQL(外部DB)でもdata.sqlを毎回実行する
spring.sql.init.mode=always

# JWT(ログイン後の合言葉)の署名鍵と有効期限(分)。秘密鍵は.envで管理する
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=1440
